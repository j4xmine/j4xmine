    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#9B87F5" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="purpleGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#A855F7" flood-opacity="0.45"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="1000" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
