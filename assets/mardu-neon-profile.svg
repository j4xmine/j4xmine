<svg width="1200" height="1000" viewBox="0 0 1200 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060913"/>
      <stop offset="0.5" stop-color="#090A14"/>
      <stop offset="1" stop-color="#080611"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="footer" x1="48" y1="0" x2="1152" y2="0">
      <stop stop-color="#10111B"/>
      <stop offset="0.6" stop-color="#11101D"/>
      <stop offset="1" stop-color="#24103A"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#B794F4" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glowPurple" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="1000" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="1000" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="998" rx="27" stroke="#8B5CF6" stroke-opacity="0.38" stroke-width="2"/>

