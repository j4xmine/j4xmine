      <g><rect x="786" y="500" width="165" height="88" rx="18" fill="#0D0C18" stroke="#A855F7" stroke-opacity="0.6"/><circle cx="868" cy="527" r="8" fill="#5EE58C"/><text x="868" y="561" fill="#FAF7FF">MongoDB</text></g>
